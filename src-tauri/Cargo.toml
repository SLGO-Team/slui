[package]
name = "slui"
version = "0.9.0"
description = "SLUI Windows UI framework for game companions"
authors = ["SLUI contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# One workspace, rooted here, for SLUI and the installer shell: one Cargo.lock and one
# target dir (src-tauri/target). workspace-hack (generated by cargo-hakari, see
# .config/hakari.toml) unifies the features of their shared dependencies, so a crate
# both use compiles once even when each package is built on its own.
[workspace]
members = [".", "../installer/src-tauri", "workspace-hack"]
resolver = "2"

# Release builds (the installer, slui.exe and slui-setup.exe) trade build time for size: measured on one
# commit, slui.exe 31.4 -> 26.6 MB, slui-setup.exe 10.0 -> 6.8 MB, the installer 33.2 -> 28.8 MB, for a
# cold CI installer build of 566 s instead of 404 s (only releases build it). Most of the gain is
# opt-level "s"; the Rust side does little CPU work (hooks, Win32 / D3D calls, rustls with
# ring's assembly). panic stays "unwind": the sidecar socket awaits tokio JoinHandles, which turn a task
# panic into an error only when it unwinds. PR CI builds the dev profile and is unaffected.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "slui_lib"
# Only the rlib slui.exe links. The template's staticlib / cdylib are for mobile targets; with the release
# profile's fat LTO each ran its own LTO pass (release rebuild of slui 291 -> 234 s without them).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Rust API only (check, download, minisign verification); the branded installer installs.
# No `zip`: that feature only reads Tauri v1 update archives.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
semver = "1"
base64 = "0.22"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
workspace-hack = { version = "0.1", path = "workspace-hack" }
tokio = { version = "1", features = ["net", "io-util", "macros", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# World blur (src/backdrop.rs): Windows.Graphics.Capture, Direct3D 11 and DirectComposition need the
# WinRT projections, which windows-sys lacks. 0.62 is the version tao already builds.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
