[package]
name = "slui"
version = "0.2.0"
description = "SLUI Windows UI framework for game companions"
authors = ["SLUI contributors"]
edition = "2021"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# One workspace, rooted here, for SLUI and the installer shell: one Cargo.lock and one
# target dir (src-tauri/target). workspace-hack (generated by cargo-hakari, see
# .config/hakari.toml) unifies the features of their shared dependencies, so a crate
# both use compiles once even when each package is built on its own.
[workspace]
members = [".", "../installer/src-tauri", "workspace-hack"]
resolver = "2"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "slui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
workspace-hack = { version = "0.1", path = "workspace-hack" }
