# release-please keeps a release PR open on main (versions + CHANGELOG.md). Merging it
# creates a draft GitHub Release with its vX.Y.Z tag; then:
#   build    builds SLUI-Setup-X.Y.Z.exe (after lint, npm test and a version check)
#   sign     signs it for the updater and checks the signature against tauri.conf.json's key
#   ci-gate  waits for the ci workflow on the tagged commit to pass
#   publish  attaches both files to the draft and publishes it
# The release stays a draft until publish runs, so a published release always carries an
# installer whose signature installed SLUI accepts (update servers fetch the latest published one).
#
# Separation: only `sign` sees the signing key, and it runs no dependency code (npm ci
# --ignore-scripts, then only the Tauri CLI). Only `publish` can write to the repository, and it
# holds no environment secret. No checkout keeps its token in .git/config. Third-party actions are
# pinned to commit SHAs (Dependabot updates the pin and its version comment).
name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A GitHub App token instead of GITHUB_TOKEN: pull requests opened with GITHUB_TOKEN
      # trigger no workflows, so the release PR would never get its required checks.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    # For CONTROL_PLANE_URL, a secret of this environment, which only main may use. This job never
    # references the signing key, the environment's other secret.
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The release's own checks; ci-gate also requires the full CI run on this commit.
      # npm test includes scripts/version-check.mjs (every file carries one version).
      - run: npm run lint
      - run: npm test
      - name: Check the tagged files carry the released version
        shell: bash
        run: |
          actual=$(node -p "require('./package.json').version")
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::package.json has $actual, release-please released $VERSION"
            exit 1
          fi
      # The Rust that rust-toolchain.toml pins, installed before rust-cache keys on its version.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: release
      - name: Build installer
        shell: bash
        env:
          VITE_CONTROL_PLANE_URL: ${{ secrets.CONTROL_PLANE_URL }}
        run: |
          if [ -z "$VITE_CONTROL_PLANE_URL" ]; then
            echo "::error::CONTROL_PLANE_URL is not set in the release environment"
            exit 1
          fi
          npm run installer:build
      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: src-tauri/target/release/bundle/setup/SLUI-Setup-${{ env.VERSION }}.exe
          if-no-files-found: error
          # NSIS output is already compressed.
          compression-level: 0
          retention-days: 7

  # minisign signature checked by SLUI's updater (src-tauri/src/updater.rs) against the public key
  # in tauri.conf.json. The signed comment carries the file name, which the updater requires to be
  # exactly SLUI-Setup-<manifest version>.exe, so sign that file, and the version (--app-version),
  # which requireSignedVersion requires to be the manifest's.
  sign:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Only for the Tauri CLI: --ignore-scripts so no dependency's install script runs next to the key.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist
      - name: Sign installer for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set in the release environment"
            exit 1
          fi
          npx --no tauri signer sign --app-version "$VERSION" "dist/SLUI-Setup-$VERSION.exe"
      # The key must be the one installed SLUI trusts; a rotated or wrong secret fails here, not
      # on every player's machine.
      - run: node scripts/verify-updater-signature.mjs "dist/SLUI-Setup-$VERSION.exe" "dist/SLUI-Setup-$VERSION.exe.sig" "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: signature
          path: dist/SLUI-Setup-${{ env.VERSION }}.exe.sig
          if-no-files-found: error
          retention-days: 7

  # The release commit's own CI run (ci.yml finishes every main run; it only cancels superseded
  # pull request runs). Runs while the installer builds.
  ci-gate:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          echo "release commit $sha"
          for _ in $(seq 1 220); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"') || run=""
            read -r status conclusion url <<< "$run"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "CI passed: $url"
                exit 0
              fi
              echo "::error::CI on the release commit ended with '$conclusion': $url (re-run it, then this job)"
              exit 1
            fi
            echo "CI ${status:-not started} ${url}"
            sleep 30
          done
          echo "::error::CI on the release commit did not finish in time"
          exit 1

  # Last job: publishing marks the release as the latest one. A failure anywhere above leaves the
  # draft unpublished; re-running the failed jobs finishes it (uploads replace the assets).
  publish:
    needs: [release-please, build, sign, ci-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The exact pair about to be published.
      - run: node scripts/verify-updater-signature.mjs "dist/SLUI-Setup-$VERSION.exe" "dist/SLUI-Setup-$VERSION.exe.sig" "$VERSION"
      - name: Upload to the draft release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "dist/SLUI-Setup-$VERSION.exe" "dist/SLUI-Setup-$VERSION.exe.sig"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
