# release-please keeps a release PR open on main (versions + CHANGELOG.md). Merging it
# creates a draft GitHub Release with its vX.Y.Z tag; the installer job then builds
# SLUI-Setup-X.Y.Z.exe and attaches it to the draft, which a maintainer publishes.
name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A GitHub App token instead of GITHUB_TOKEN: pull requests opened with GITHUB_TOKEN
      # trigger no workflows, so the release PR would never get its required checks.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  installer:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    # The control-plane URL is a secret of this environment, which only main may use.
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release
      - name: Build installer
        shell: bash
        env:
          VITE_CONTROL_PLANE_URL: ${{ secrets.CONTROL_PLANE_URL }}
        run: |
          if [ -z "$VITE_CONTROL_PLANE_URL" ]; then
            echo "::error::CONTROL_PLANE_URL is not set in the release environment"
            exit 1
          fi
          npm run installer:build
      # Re-running this job replaces the asset. gh finds draft releases by tag.
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "src-tauri/target/release/bundle/setup/SLUI-Setup-$VERSION.exe" --clobber
