# release-please keeps a release PR open on main (versions + CHANGELOG.md). Merging it
# creates a draft GitHub Release with its vX.Y.Z tag; the installer job then builds
# SLUI-Setup-X.Y.Z.exe, signs it for the updater and attaches both files to the draft,
# which a maintainer publishes.
name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A GitHub App token instead of GITHUB_TOKEN: pull requests opened with GITHUB_TOKEN
      # trigger no workflows, so the release PR would never get its required checks.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  installer:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    # The control-plane URL and the updater signing key are secrets of this environment,
    # which only main may use.
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release
      - name: Build installer
        shell: bash
        env:
          VITE_CONTROL_PLANE_URL: ${{ secrets.CONTROL_PLANE_URL }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$VITE_CONTROL_PLANE_URL" ]; then
            echo "::error::CONTROL_PLANE_URL is not set in the release environment"
            exit 1
          fi
          # Checked before the build: an unsigned release can never be offered as an update.
          if [ "$HAS_SIGNING_KEY" != "true" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set in the release environment"
            exit 1
          fi
          npm run installer:build
      # minisign signature checked by SLUI's updater (src-tauri/src/updater.rs) against the
      # public key in tauri.conf.json. The signed comment carries the file name, which the
      # updater requires to be exactly SLUI-Setup-<manifest version>.exe, so sign that file.
      - name: Sign installer for the updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri signer sign "src-tauri/target/release/bundle/setup/SLUI-Setup-$VERSION.exe"
          test -s "src-tauri/target/release/bundle/setup/SLUI-Setup-$VERSION.exe.sig"
      # Re-running this job replaces the assets. gh finds draft releases by tag.
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --clobber \
            "src-tauri/target/release/bundle/setup/SLUI-Setup-$VERSION.exe" \
            "src-tauri/target/release/bundle/setup/SLUI-Setup-$VERSION.exe.sig"
