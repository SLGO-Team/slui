# Required check `build-and-test` (main ruleset). Runs on main too, so pull requests can
# restore the npm and Rust caches main saved. No path filters: a required check that is
# filtered out stays pending and blocks the merge.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      # Line tables keep test backtraces readable; full debug info made the Rust cache ~836 MB,
      # whose restore and link time CI paid on every run. Local builds keep full debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The local npm registry mirror has no audit endpoint, so this is where advisories surface.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      # Production-mode build, the same as a release except for the address:
      # vite.config.ts refuses to build without one, and .invalid never resolves.
      - run: npm run build
        env:
          VITE_CONTROL_PLANE_URL: https://control-plane.invalid
      # The installer shell's frontend; installer/src-tauri embeds it at compile time.
      - run: npm run installer:vite:build
      # The Rust that rust-toolchain.toml pins, installed before rust-cache keys on its version.
      - run: rustup toolchain install
      # One Cargo workspace rooted at src-tauri: SLUI, the installer shell and workspace-hack.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # workspace-hack must match the dependency graph, or SLUI and the installer shell
      # compile shared crates twice (src-tauri/.config/hakari.toml).
      # rust-cache keeps registry/cache but not registry/src: the first cargo command unpacks every
      # dependency's sources. A step of its own so its time is not booked to the hakari check.
      - run: cargo metadata --format-version 1 --manifest-path src-tauri/Cargo.toml > $null
      - uses: taiki-e/install-action@v2
        with:
          # cargo-about pinned to the version that generated THIRD_PARTY_LICENSES.txt (same text out).
          tool: cargo-hakari,cargo-about@0.9.3
      - run: cargo hakari generate --diff && cargo hakari manage-deps --dry-run
        working-directory: src-tauri
      # The installer ships THIRD_PARTY_LICENSES.txt: it must list the current Cargo.lock and npm runtime
      # dependencies, and every license must be in scripts/licenses/about.toml's accepted list.
      - run: npm run licenses -- --check
      # Both crates in one build, so their shared dependencies compile once.
      - run: cargo test --workspace --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --workspace --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
