# cargo-about configuration for THIRD_PARTY_LICENSES.txt (scripts/generate-licenses.mjs).
# Only what ships: the Windows target's normal dependencies of the workspace (slui.exe, slui-setup.exe,
# slui-uninstall.exe); build and dev dependencies are not distributed.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The workspace's own crates (publish = false) are SLUI itself.
private = { ignore = true }
# Licenses compatible with distributing the crates inside a GPL-3.0-or-later program. A crate whose license
# expression cannot be satisfied by this list fails the generation.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
# Known crates whose license files cargo-about cannot read on its own.
workarounds = ["ring", "rustls"]
